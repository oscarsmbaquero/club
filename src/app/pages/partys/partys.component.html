
@if(loading){
  <app-loading></app-loading>
} @else {
  <div class="sticky-header">
    <h1 [ngClass]="{'scrolled': isScrolled}" style="text-align: center;">Fiestas</h1>
  </div>
  
  <p style="text-align: center;">No te pierdas las fiestas más locas de la noche madrileña. El mejor ambiente swinger de Madrid.</p>
  <div class="card-container">
        @for(item of partys; track item){
          <div class="card flip-card">
            <div class="flip-card-inner">
              <div class="flip-card-front">
                <img src={{item.image}} alt={{item.nombre}}>
                <div class="overlay">
                  <!-- <img src="/images/mano.png" style="width: 50px; height: auto;" /> -->
                  <h2>{{item.nombre}}</h2>
                  <p>{{item.fecha}}</p>
                    <span class="m-2">{{item.descripcion}}</span>
                </div>
              </div>
            </div>  
        </div>
      }
    </div>
}
